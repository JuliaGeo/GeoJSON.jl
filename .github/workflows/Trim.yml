name: Trim
on:
  pull_request:
  push:
    branches: [main]
jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Compile and run schema read and write
        env:
          JULIA_NUM_THREADS: '1'
          JULIA_NUM_PRECOMPILE_TASKS: '1'
        run: julia --project=test/trim -e 'using Pkg; Pkg.instantiate(); include("test/trim/runtests.jl")'
