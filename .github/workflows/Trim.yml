name: Trim
on:
  pull_request:
    paths: ['src/**', 'test/trim/**', 'Project.toml', '.github/workflows/Trim.yml']
  push:
    branches: [main]
    paths: ['src/**', 'test/trim/**', 'Project.toml', '.github/workflows/Trim.yml']
  workflow_dispatch:
jobs:
  trim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      # Trimming is experimental. Pin JuliaC so compiler changes are reviewed.
      - name: Install pinned JuliaC
        run: julia -e 'using Pkg; Pkg.Apps.add(PackageSpec(name="JuliaC", version="0.3.12"))'
      - name: Build safely trimmed app and compare with JIT
        run: |
          export PATH="$HOME/.julia/bin:$PATH"
          julia --project=test/trim test/trim/runtests.jl
