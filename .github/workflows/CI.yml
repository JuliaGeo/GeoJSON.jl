name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v5
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  downgrade:
    name: Julia 1.10 - minimum dependencies - Parsers ${{ matrix.parsers }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        parsers: ['2.8.8', '3.0.0']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      # Select the Parsers compatibility range before resolving all floors.
      # Otherwise downgrading fixes compat to 2.8.8 and a later 3.x add fails.
      - name: Select the exact Parsers floor
        run: |
          julia --project -e '
            using TOML
            project = TOML.parsefile("Project.toml")
            project["compat"]["Parsers"] = "=${{ matrix.parsers }}"
            open(io -> TOML.print(io, project), "Project.toml", "w")
            cp("Project.toml", "Project.floor.toml"; force=true)
          '
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          mode: deps
      - name: Keep dependency floors fixed during test resolution
        run: |
          julia --project -e '
            using Pkg
            # Keep resolved floors from the action, but restore declarations: it
            # may promote test extras to runtime deps, confusing Aqua checks.
            cp("Project.floor.toml", "Project.toml"; force=true)
            Pkg.instantiate()
            versions = Dict(info.name => info.version for info in values(Pkg.dependencies()))
            @assert versions["JSON"] == v"1.12.0"
            @assert versions["StructUtils"] == v"2.10.0"
            @assert versions["Parsers"] == v"${{ matrix.parsers }}"
            Pkg.pin(["JSON", "StructUtils", "Parsers"])
          '
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          GEOJSON_TEST_FLOORS: 'true'
        with:
          allow_reresolve: false
          force_latest_compatible_version: false
